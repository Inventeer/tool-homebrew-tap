name: Confidentiality Gate

# Calls the confidentiality gate on every pull request into main, through the
# public copy of the gate's bootstrap in Inventeer/tool-confidentiality-gate:
# GitHub shares the Hub's private reusable workflow with private repositories
# only. The gate's scripts live in the Hub; this repo passes only its settings.
# What the gate checks, why it fails closed, and what it refuses (a pull
# request from a fork ends red): Inventeer/tool-confidentiality-gate README.
#
# This repo's settings:
#   allow_sensitivity: O and max_tier: open. A public repository holds only the
#     base tier; the gate fails a folder classified above open.
#   company_tenant_direction: none. No company-folder direction applies here.
#
# Required status check: "gate / confidentiality-gate", registered in this
# repo's "Confidentiality gate" ruleset for the default branch.
#
# Run by hand (Actions -> Confidentiality Gate -> Run workflow) to scan every
# tracked file of the chosen branch instead of a pull request's added lines.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede in-flight runs when a PR is updated.
concurrency:
  group: confidentiality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    uses: Inventeer/tool-confidentiality-gate/.github/workflows/confidentiality-gate.yml@main
    with:
      hub_reader_app_id: ${{ vars.HUB_READER_APP_ID }}
      allow_sensitivity: "O"
      max_tier: open
      company_tenant_direction: none
      scan: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'diff' }}
    secrets:
      HUB_READER_APP_PRIVATE_KEY: ${{ secrets.HUB_READER_APP_PRIVATE_KEY }}
